name: Build Test

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build_test:
    name: ${{ matrix.name }} Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show CPU Info (Linux)
        if: runner.os == 'Linux'
        run: lscpu

      - name: Show CPU Info (macOS)
        if: runner.os == 'macOS'
        run: sysctl -n machdep.cpu.brand_string

      - name: Show CPU Info (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-CimInstance -ClassName Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

      - name: Build and run SSE2 static dispatch (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-static-sse2 -DSTATIC_DISPATCH_EXAMPLE=ON -DUSE_SSE2=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-static-sse2 --target zldsp_fft_static_dispatch_example --parallel
          ./build-static-sse2/zldsp_fft_static_dispatch_example 5 20

      - name: Build and run AVX2 static dispatch (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-static-avx2 -DSTATIC_DISPATCH_EXAMPLE=ON -DUSE_AVX2=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-static-avx2 --target zldsp_fft_static_dispatch_example --parallel
          ./build-static-avx2/zldsp_fft_static_dispatch_example 5 20

      - name: Build and run dynamic dispatch (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-dynamic -DDYNAMIC_DISPATCH_EXAMPLE=ON -DUSE_SSE2=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-dynamic --target zldsp_fft_dynamic_dispatch_example --parallel
          ./build-dynamic/zldsp_fft_dynamic_dispatch_example 5 20

      - name: Build and run NEON static dispatch (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-static-neon -DSTATIC_DISPATCH_EXAMPLE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-static-neon --target zldsp_fft_static_dispatch_example --parallel
          ./build-static-neon/zldsp_fft_static_dispatch_example 5 20

      - name: Build and run dynamic dispatch (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-dynamic -DDYNAMIC_DISPATCH_EXAMPLE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-dynamic --target zldsp_fft_dynamic_dispatch_example --parallel
          ./build-dynamic/zldsp_fft_dynamic_dispatch_example 5 20

      - name: Build and run SSE2 static dispatch (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          if not defined VS_PATH exit /b 1
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build-static-sse2 -DSTATIC_DISPATCH_EXAMPLE=ON -DUSE_SSE2=ON
          cmake --build build-static-sse2 --config Release --target zldsp_fft_static_dispatch_example --parallel
          build-static-sse2\Release\zldsp_fft_static_dispatch_example.exe 5 20

      - name: Build and run AVX2 static dispatch (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          if not defined VS_PATH exit /b 1
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build-static-avx2 -DSTATIC_DISPATCH_EXAMPLE=ON -DUSE_AVX2=ON
          cmake --build build-static-avx2 --config Release --target zldsp_fft_static_dispatch_example --parallel
          build-static-avx2\Release\zldsp_fft_static_dispatch_example.exe 5 20

      - name: Build and run dynamic dispatch (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          if not defined VS_PATH exit /b 1
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build-dynamic -DDYNAMIC_DISPATCH_EXAMPLE=ON -DUSE_SSE2=ON
          cmake --build build-dynamic --config Release --target zldsp_fft_dynamic_dispatch_example --parallel
          build-dynamic\Release\zldsp_fft_dynamic_dispatch_example.exe 5 20
