name: Accuracy Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build_and_test:
    name: ${{ matrix.os }} ${{ matrix.kind }} ${{ matrix.precision }} Accuracy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        kind: [cfft, rfft]
        precision: [float, double]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements-accuracy.txt

      - name: Install FLINT reference
        run: |
          python -m pip install --only-binary=:all: -r benchmark/requirements-accuracy.txt

      - name: Set up Windows compiler environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Validate reference and sample transport
        run: python -m unittest discover -s benchmark -p test_flint_reference.py -v

      - name: Show CPU Info (Linux)
        if: runner.os == 'Linux'
        run: lscpu

      - name: Show CPU Info (macOS)
        if: runner.os == 'macOS'
        run: sysctl -n machdep.cpu.brand_string

      - name: Show CPU Info (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-CimInstance -ClassName Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

      - name: FLINT accuracy and API consistency
        shell: bash
        run: |
          python -u benchmark/run.py accuracy ${{ matrix.kind }} 2 20 ${{ matrix.precision == 'double' && '--double' || '' }}
          python -u benchmark/run.py accuracy ${{ matrix.kind }} 2 20 --apis ${{ matrix.precision == 'double' && '--double' || '' }}

      - name: FLINT accuracy and API consistency AVX2 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -u benchmark/run.py accuracy ${{ matrix.kind }} 2 20 --avx2 ${{ matrix.precision == 'double' && '--double' || '' }}
          python -u benchmark/run.py accuracy ${{ matrix.kind }} 2 20 --apis --avx2 ${{ matrix.precision == 'double' && '--double' || '' }}
