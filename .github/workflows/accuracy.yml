name: Accuracy Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: ${{ matrix.platform.name }} ${{ matrix.kind }} Accuracy (float + double)
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kind: [cfft, rfft]
        platform:
          - name: Linux SSE2
            os: ubuntu-latest
            flags: --sse2
          - name: Linux AVX2
            os: ubuntu-latest
            flags: --avx2
          - name: macOS
            os: macos-latest
            flags: ''

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmark/requirements-accuracy.txt

      - name: Install FLINT reference
        run: |
          python -m pip install --only-binary=:all: -r benchmark/requirements-accuracy.txt

      - name: Validate reference and sample transport
        run: python -m unittest discover -s benchmark -p test_flint_reference.py -v

      - name: Show build tools
        run: |
          python --version
          cmake --version
          ninja --version
          clang++ --version

      - name: Show CPU Info (Linux)
        if: runner.os == 'Linux'
        run: lscpu

      - name: Show CPU Info (macOS)
        if: runner.os == 'macOS'
        run: sysctl -n machdep.cpu.brand_string

      - name: FLINT library accuracy (float)
        run: |
          python -u benchmark/run.py accuracy ${{ matrix.kind }} 2 20 ${{ matrix.platform.flags }}

      - name: API consistency (float)
        run: |
          python -u benchmark/run.py accuracy ${{ matrix.kind }} 2 20 --apis ${{ matrix.platform.flags }}

      - name: FLINT library accuracy (double)
        run: |
          python -u benchmark/run.py accuracy ${{ matrix.kind }} 2 20 --double ${{ matrix.platform.flags }}

      - name: API consistency (double)
        run: |
          python -u benchmark/run.py accuracy ${{ matrix.kind }} 2 20 --apis --double ${{ matrix.platform.flags }}
